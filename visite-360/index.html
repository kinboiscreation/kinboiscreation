<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visite 360° - Kin Bois Création | Atelier de Menuiserie Artisanale</title>
  <meta name="description" content="Découvrez l'atelier de Kin Bois Création en réalité virtuelle 360°. Explorez notre espace de travail, nos matériaux et nos créations en bois massif à Kinshasa.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_CD">
  <meta property="og:title" content="Visite 360° - Kin Bois Création">
  <meta property="og:description" content="Explorez l'atelier de menuiserie en réalité virtuelle 360°">
  <meta property="og:url" content="https://kinboiscreation.github.io/kinboiscreation/visite-360/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ivoire: #F7F4EE;
      --pierre: #EDE7DA;
      --bois: #33241A;
      --argile: #B87333;
      --ebene: #15110C;
      --or-fin: #C9A961;
      --choc-1: #CE9A66;
      --copper-dark: #2B170B;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Space Grotesk', sans-serif;
      background: var(--ebene);
      color: var(--ivoire);
      overflow: hidden;
    }

    /* Conteneur principal */
    .tour-360-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--ebene);
    }

    /* Canvas Babylon.js */
    #canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Écran de chargement */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--ebene) 0%, #1a130f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 1;
      transition: opacity 0.6s ease-out;
      pointer-events: auto;
    }

    .loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .logo-loading {
      width: 80px;
      height: 80px;
      margin-bottom: 40px;
      opacity: 0.9;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 2px solid rgba(184, 115, 51, 0.3);
      border-top-color: var(--argile);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 30px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.9rem;
      color: rgba(247, 244, 238, 0.7);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .progress-bar {
      width: 200px;
      height: 2px;
      background: rgba(184, 115, 51, 0.2);
      margin-top: 30px;
      overflow: hidden;
      border-radius: 1px;
    }

    .progress-fill {
      height: 100%;
      background: var(--argile);
      width: 0%;
      transition: width 0.3s ease-out;
    }

    /* UI Principale */
    .tour-ui {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .tour-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 32px;
      background: linear-gradient(to bottom, rgba(21, 17, 12, 0.8), transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(184, 115, 51, 0.2);
      pointer-events: auto;
    }

    .tour-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--or-fin);
      letter-spacing: 0.02em;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tour-logo span {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(247, 244, 238, 0.6);
    }

    .tour-logo:hover {
      color: var(--argile);
    }

    .tour-header-right {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .scene-indicator {
      font-size: 0.8rem;
      color: rgba(247, 244, 238, 0.8);
      letter-spacing: 0.05em;
      background: rgba(51, 36, 26, 0.5);
      padding: 8px 14px;
      border-radius: 2px;
      border: 1px solid rgba(184, 115, 51, 0.3);
    }

    /* Navigation principale */
    .tour-nav {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      align-items: center;
      pointer-events: auto;
      z-index: 110;
    }

    .nav-button {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(51, 36, 26, 0.7);
      border: 1px solid rgba(184, 115, 51, 0.4);
      color: var(--argile);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.35s cubic-bezier(0.16, 0.8, 0.24, 1);
      backdrop-filter: blur(6px);
    }

    .nav-button:hover {
      background: rgba(184, 115, 51, 0.3);
      border-color: var(--argile);
      transform: translateY(-3px);
    }

    .nav-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .nav-button:disabled:hover {
      background: rgba(51, 36, 26, 0.7);
      border-color: rgba(184, 115, 51, 0.4);
    }

    .nav-separator {
      width: 1px;
      height: 24px;
      background: rgba(184, 115, 51, 0.3);
    }

    .nav-scene-num {
      font-size: 0.9rem;
      color: rgba(247, 244, 238, 0.7);
      min-width: 30px;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
    }

    /* Menu latéral scènes */
    .scene-menu {
      position: fixed;
      left: 32px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: auto;
      z-index: 90;
    }

    .menu-toggle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(51, 36, 26, 0.7);
      border: 1px solid rgba(184, 115, 51, 0.4);
      color: var(--argile);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      transition: all 0.35s cubic-bezier(0.16, 0.8, 0.24, 1);
      backdrop-filter: blur(6px);
    }

    .menu-toggle:hover {
      background: rgba(184, 115, 51, 0.3);
      border-color: var(--argile);
      transform: scale(1.1);
    }

    .menu-panel {
      position: fixed;
      left: 0;
      top: 0;
      width: 280px;
      height: 100%;
      background: linear-gradient(to right, rgba(21, 17, 12, 0.95), rgba(51, 36, 26, 0.8));
      backdrop-filter: blur(10px);
      border-right: 1px solid rgba(184, 115, 51, 0.2);
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.16, 0.8, 0.24, 1);
      z-index: 80;
      overflow-y: auto;
      pointer-events: auto;
    }

    .menu-panel.open {
      transform: translateX(0);
    }

    .menu-header {
      padding: 24px 20px;
      border-bottom: 1px solid rgba(184, 115, 51, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--or-fin);
    }

    .menu-close {
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      color: var(--argile);
      cursor: pointer;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
      transition: opacity 0.25s ease;
    }

    .menu-close:hover {
      opacity: 1;
    }

    .menu-scenes {
      padding: 16px 0;
    }

    .menu-scene-item {
      padding: 14px 20px;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .menu-scene-item:hover {
      background: rgba(184, 115, 51, 0.15);
      border-left-color: var(--argile);
    }

    .menu-scene-item.active {
      background: rgba(184, 115, 51, 0.25);
      border-left-color: var(--argile);
    }

    .menu-scene-num {
      font-size: 0.75rem;
      color: var(--argile);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .menu-scene-name {
      font-size: 0.95rem;
      color: var(--ivoire);
      font-weight: 400;
    }

    .menu-scene-desc {
      font-size: 0.8rem;
      color: rgba(247, 244, 238, 0.6);
    }

    /* Hotspot UI */
    .hotspot-info {
      position: fixed;
      background: rgba(51, 36, 26, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(184, 115, 51, 0.4);
      border-radius: 4px;
      padding: 16px 20px;
      color: var(--ivoire);
      max-width: 280px;
      pointer-events: auto;
      z-index: 95;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }

    .hotspot-info.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .hotspot-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--or-fin);
      margin-bottom: 8px;
    }

    .hotspot-description {
      font-size: 0.85rem;
      line-height: 1.5;
      color: rgba(247, 244, 238, 0.8);
      margin-bottom: 12px;
    }

    .hotspot-button {
      background: var(--argile);
      color: var(--ebene);
      border: none;
      padding: 8px 12px;
      border-radius: 2px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hotspot-button:hover {
      background: var(--or-fin);
      transform: translateY(-2px);
    }

    /* Contrôles mobiles */
    .mobile-controls {
      position: fixed;
      right: 16px;
      bottom: 100px;
      display: none;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
      z-index: 90;
    }

    .control-button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(51, 36, 26, 0.7);
      border: 1px solid rgba(184, 115, 51, 0.4);
      color: var(--argile);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.25s ease;
      backdrop-filter: blur(6px);
    }

    .control-button:hover {
      background: rgba(184, 115, 51, 0.3);
      border-color: var(--argile);
    }

    /* Fullscreen */
    .fullscreen-toggle {
      position: fixed;
      right: 32px;
      top: 32px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(51, 36, 26, 0.7);
      border: 1px solid rgba(184, 115, 51, 0.4);
      color: var(--argile);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.35s cubic-bezier(0.16, 0.8, 0.24, 1);
      backdrop-filter: blur(6px);
      pointer-events: auto;
    }

    .fullscreen-toggle:hover {
      background: rgba(184, 115, 51, 0.3);
      border-color: var(--argile);
      transform: scale(1.1);
    }

    /* Home button */
    .home-button {
      position: fixed;
      top: 32px;
      left: 32px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(51, 36, 26, 0.7);
      border: 1px solid rgba(184, 115, 51, 0.4);
      color: var(--argile);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.35s cubic-bezier(0.16, 0.8, 0.24, 1);
      backdrop-filter: blur(6px);
      pointer-events: auto;
      text-decoration: none;
    }

    .home-button:hover {
      background: rgba(184, 115, 51, 0.3);
      border-color: var(--argile);
      transform: scale(1.1);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .tour-header {
        padding: 16px 20px;
      }

      .tour-nav {
        bottom: 16px;
        gap: 10px;
      }

      .nav-button {
        width: 44px;
        height: 44px;
        font-size: 1rem;
      }

      .nav-separator {
        display: none;
      }

      .nav-scene-num {
        display: none;
      }

      .scene-indicator {
        font-size: 0.75rem;
        padding: 6px 10px;
      }

      .mobile-controls {
        display: flex;
      }

      .scene-menu {
        display: none;
      }

      .menu-toggle {
        position: fixed;
        bottom: 80px;
        left: 16px;
        z-index: 91;
      }
    }

    @media (max-width: 560px) {
      .tour-header {
        padding: 12px 16px;
      }

      .tour-logo {
        font-size: 1rem;
      }

      .tour-nav {
        bottom: 12px;
        gap: 8px;
      }

      .nav-button {
        width: 40px;
        height: 40px;
        font-size: 0.9rem;
      }

      .control-button {
        width: 40px;
        height: 40px;
      }

      .fullscreen-toggle,
      .home-button {
        width: 40px;
        height: 40px;
        font-size: 1rem;
      }

      .hotspot-info {
        max-width: 240px;
        padding: 12px 16px;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(51, 36, 26, 0.3);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(184, 115, 51, 0.5);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(184, 115, 51, 0.7);
    }
  </style>
</head>
<body>
  <div class="tour-360-container">
    <!-- Canvas Babylon.js -->
    <canvas id="canvas"></canvas>

    <!-- Écran de chargement -->
    <div class="loading-screen" id="loadingScreen">
      <svg class="logo-loading" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="30" fill="none" stroke="#B87333" stroke-width="2" opacity="0.3"/>
        <path d="M32 4 L45 28 L32 52 L19 28 Z" fill="#B87333" opacity="0.8"/>
      </svg>
      <div class="spinner"></div>
      <div class="loading-text">Chargement de la visite...</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- UI Principale -->
    <div class="tour-ui">
      <!-- Header -->
      <div class="tour-header">
        <a href="/" class="tour-logo">
          Kin Bois Création
          <span>Visite 360°</span>
        </a>
        <div class="tour-header-right">
          <div class="scene-indicator">
            <span id="sceneNumber">1</span> / <span id="totalScenes">7</span> - <span id="sceneName">Accueil</span>
          </div>
        </div>
      </div>

      <!-- Bouton Retour accueil (desktop) -->
      <a href="/" class="home-button" title="Retour à l'accueil">
        ⌂
      </a>

      <!-- Bouton Fullscreen -->
      <button class="fullscreen-toggle" id="fullscreenBtn" title="Plein écran">
        ⛶
      </button>

      <!-- Contrôles mobiles -->
      <div class="mobile-controls">
        <button class="control-button" id="zoomInBtn" title="Agrandir">+</button>
        <button class="control-button" id="zoomOutBtn" title="Réduire">−</button>
        <button class="control-button" id="gyroBtn" title="Mode gyroscope">◎</button>
      </div>
    </div>

    <!-- Menu latéral -->
    <div class="scene-menu">
      <button class="menu-toggle" id="menuToggle" title="Menu">☰</button>
    </div>

    <div class="menu-panel" id="menuPanel">
      <div class="menu-header">
        <div class="menu-title">Parcours</div>
        <button class="menu-close" id="menuClose">✕</button>
      </div>
      <div class="menu-scenes" id="menuScenes"></div>
    </div>

    <!-- Hotspot Info -->
    <div class="hotspot-info" id="hotspotInfo">
      <div class="hotspot-title" id="hotspotTitle">Titre</div>
      <div class="hotspot-description" id="hotspotDesc">Description</div>
      <button class="hotspot-button" id="hotspotBtn">Continuer</button>
    </div>
  </div>

  <!-- Babylon.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@7/babylon.js"></script>

  <!-- Scripts locaux -->
  <script src="js/scenes.js"></script>
  <script src="js/visite-360.js"></script>
  <script src="js/responsive.js"></script>
</body>
</html>
