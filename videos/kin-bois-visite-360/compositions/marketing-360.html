<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Tour 360° - Kin Bois Création</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #fff;
      line-height: 1.6;
    }

    #root {
      width: 100%;
      height: 100%;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    .scene {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .scene-title {
      font-family: Georgia, serif;
      font-size: 56px;
      font-weight: 700;
      color: #C9A961;
      margin-bottom: 15px;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
      letter-spacing: 2px;
    }

    .scene-description {
      font-size: 24px;
      color: #F5F1E8;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
      max-width: 700px;
    }

    .title-screen {
      background: linear-gradient(135deg, #33241A 0%, #1a1a1a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .main-title {
      font-family: Georgia, serif;
      font-size: 64px;
      font-weight: 700;
      color: #C9A961;
      margin-bottom: 15px;
      text-shadow: 3px 3px 12px rgba(0, 0, 0, 0.8);
      text-align: center;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 28px;
      color: #F5F1E8;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .cta-button {
      display: inline-block;
      padding: 14px 36px;
      background: #C9A961;
      color: #33241A;
      font-size: 20px;
      font-weight: 700;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      margin-top: 20px;
      box-shadow: 0 4px 12px rgba(201, 169, 97, 0.5);
      transition: all 0.3s ease;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .cta-button:hover {
      background: #F5F1E8;
      color: #33241A;
      transform: scale(1.08);
    }

    .arrow {
      font-size: 24px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="marketing-360" data-width="1920" data-height="1080">
    <!-- Opening Title -->
    <div class="clip title-screen" id="title-open" data-start="0" data-duration="3000">
      <div class="main-title">KIN BOIS CRÉATION</div>
      <div class="subtitle">Menuiserie Artisanale</div>
    </div>

    <!-- Scene 1: Accueil - Quick intro -->
    <div class="clip scene" id="scene-1-accueil"
         data-start="3000"
         data-duration="5000"
         style="background-image: url('assets/360/01-accueil.jpg')">
      <div class="scene-overlay">
        <div class="scene-title">Découvrez notre atelier</div>
        <div class="scene-description">en 360°</div>
      </div>
    </div>

    <!-- Scene 2: Atelier - Interaction highlight -->
    <div class="clip scene" id="scene-2-atelier"
         data-start="8000"
         data-duration="4000"
         style="background-image: url('assets/360/02-atelier.jpg')">
      <div class="scene-overlay">
        <div class="scene-description">Explorez librement chaque espace</div>
      </div>
    </div>

    <!-- Scene 6: Détail - Craftsmanship focus -->
    <div class="clip scene" id="scene-6-detail"
         data-start="12000"
         data-duration="6000"
         style="background-image: url('assets/360/06-showcase.jpg')">
      <div class="scene-overlay">
        <div class="scene-title">Meubles artisanaux</div>
        <div class="scene-description">en bois massif de qualité</div>
      </div>
    </div>

    <!-- Scene 7: Contact - Strong CTA -->
    <div class="clip scene" id="scene-7-contact"
         data-start="18000"
         data-duration="7000"
         style="background-image: url('assets/360/07-contact.jpg')">
      <div class="scene-overlay">
        <div class="scene-title">Parlons de votre projet</div>
        <button class="cta-button">Visiter maintenant <span class="arrow">→</span></button>
      </div>
    </div>

    <!-- Closing outro -->
    <div class="clip title-screen" id="title-close" data-start="25000" data-duration="5000">
      <div class="subtitle">Visite 360° complète</div>
      <button class="cta-button">Cliquez ici <span class="arrow">→</span></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    // Register timeline for HyperFrames rendering
    window.__timelines = window.__timelines || {};
    window.__timelines['marketing-360'] = gsap.timeline({ paused: true });

    // Timeline setup for fade transitions
    const tl = window.__timelines['marketing-360'];
    const clips = document.querySelectorAll('.clip');

    clips.forEach((clip, index) => {
      const startTime = parseFloat(clip.getAttribute('data-start')) / 1000;
      const duration = parseFloat(clip.getAttribute('data-duration')) / 1000;

      // Fade in
      tl.fromTo(clip,
        { opacity: 0 },
        { opacity: 1, duration: 0.3 },
        startTime
      );

      // Fade out before next clip
      tl.to(clip,
        { opacity: 0, duration: 0.3 },
        startTime + duration - 0.3
      );
    });
  </script>
</body>
</html>
