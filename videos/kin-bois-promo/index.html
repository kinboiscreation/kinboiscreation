      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

  <body>

    <script>

      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 2.5);
        tl.fromTo("#el-02-geste", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 2.5);

        tl.to("#el-03-vitrine-bois", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7.2);
        tl.fromTo("#el-04-vitrine-portes", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7.2);

        tl.to({}, { duration: 20.8 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
