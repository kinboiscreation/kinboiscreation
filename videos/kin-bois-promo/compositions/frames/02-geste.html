<template>
  <style>

  <div id="root" data-composition-id="02-geste" data-duration="3" data-width="1080" data-height="1920">
    <div class="clip geste-bg" data-start="0" data-duration="3" data-track-index="0"></div>

    <div class="geste-camera" id="geste-camera">
      <div class="geste-content">
        <div class="clip geste-image-wrap" id="geste-image-wrap" data-start="0" data-duration="3" data-track-index="1">
          <img src="assets/lit-tete-de-lit-sculptee-showroom.webp" alt="" />
        </div>

        <div class="clip geste-caption" id="geste-caption" data-start="0.8" data-duration="2.2" data-track-index="2">
          <div class="geste-scrim" id="geste-scrim"></div>
          <h3 class="geste-headline" id="geste-headline">
            <span class="geste-word">Chaque </span><span class="geste-word">pièce, </span><span class="geste-word">faite </span><span class="geste-word">à </span><span class="geste-word">la </span><span class="geste-word">main</span>

  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });

      var camera = document.getElementById("geste-camera");

      // Phase scale: subtle back -> neutral -> slight push, so the shot
      // never sits perfectly still while the caption reveals underneath.
      var phase = { scale: 0.96 };
      tl.to(phase, { scale: 1.0, duration: 1.1, ease: "power2.out" }, 0.15);
      tl.to(phase, { scale: 1.03, duration: 1.1, ease: "power3.out" }, 1.35);

      // Continuous slow lateral drift (Lissajous), single writer of transform.
      var drift = { p: 0 };
      tl.to(
        drift,
        {
          p: Math.PI * 2 * 1,
          duration: 2.5,
          ease: "none",
          onUpdate: function () {
            var dx = Math.sin(drift.p) * 5;
            var dy = Math.sin(drift.p * 1.3) * 2;
            camera.style.transform =
              "scale(" + phase.scale + ") translate(" + dx + "px, " + dy + "px)";
          },
        },
        0
      );

      // Scene 1 — full-bleed product shot enters.
      tl.fromTo(
        "#geste-image-wrap",
        { opacity: 0, scale: 1.06 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },
        0
      );

      // Scene 2 — soft ivoire scrim, then headline reveals per-word.
      tl.fromTo(
        "#geste-scrim",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power1.out" },
        0.8
      );

      tl.fromTo(
        "#geste-caption .geste-word",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", stagger: 0.09 },
        0.85
      );

      window.__timelines["02-geste"] = tl;
    })();
  </script>
