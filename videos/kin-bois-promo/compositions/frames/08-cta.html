  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var glow = document.getElementById("f08-cta-glow");

      // Scene 1 (0.0-1.0s): solid ivoire canvas is already the ground (.f08-cta-bg).
      // The compass ring settles in as ambient atmosphere while the cuivre glow blooms
      // in behind the wordmark and the wordmark itself fades/rises up centered in the
      // upper-middle — glow and hero land as ONE beat, resolving together at ~0.9s.
      tl.fromTo(
        "#f08-cta-ring",
        { opacity: 0, scale: 0.92 },
        { opacity: 0.26, scale: 1, duration: 0.6, ease: "power2.out" },
        0
      );
      tl.fromTo(
        glow,
        { opacity: 0, scale: 0.85 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power2.out" },
        0.35
      );
      tl.fromTo(
        "#f08-cta-wordmark",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        0.3
      );

      // Bounded idle breathe on the glow for the rest of the hold — a finite phase
      // tween (never a yoyo loop); sin(0) = 0 so it starts exactly at the bloom's
      // resting state and completes one full cycle by the final frame.
      var phase = { p: 0 };
      var GLOW_PEAK_OPACITY = 0.28;
      var OPACITY_AMP = 0.04;
      var SCALE_AMP = 0.02;
      tl.to(
        phase,
        {
          p: Math.PI * 2,
          duration: 3.1,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(phase.p);
            glow.style.opacity = String(GLOW_PEAK_OPACITY + s * OPACITY_AMP);
            glow.style.transform = "scale(" + (1 + s * SCALE_AMP) + ")";
          },
        },
        0.9
      );

      // Scene 2 (1.0-2.2s): "Devis gratuit -> WhatsApp" reveals beneath the wordmark
      // with a single fade + slight rise, in cuivre.
      tl.fromTo(
        "#f08-cta-ctaline",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        1.0
      );

      // Scene 3 (2.2-3.2s): the phone number reveals beneath that, in ink — the last
      // piece to land.
      tl.fromTo(
        "#f08-cta-phone",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        2.2
      );

      // The closing ink accent line draws in, resolving fully by 3.2s — the top of
      // Scene 4.
      tl.fromTo(
        "#f08-cta-accent-line",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.45, ease: "power2.out" },
        2.75
      );

      // video — no exit tween. Only the glow's bounded breathe (already running)
      // stays alive. This is the film's real exit; no harness transition follows.

      window.__timelines["08-cta"] = tl;
    })();
