<template>
  <style>
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("assets/fonts/cormorant-garamond-latin-400-normal.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
    }

    /* Full-bleed safety ground — rides UNDER the portrait, never on #root itself. */
    .hook-bg {
      position: absolute;
      inset: 0;
      background: #33241a; /* accent — dark umber, matches the workshop wood tones */
    }

    /* Camera wraps the ENTIRE scene (image + copy) so both move as one shot. */
    .hook-camera {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .hook-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 50%;
      display: block;
    }

    /* Soft vignette — edges only, center stays clean. */
    .hook-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 220px 70px rgba(21, 17, 12, 0.38);
    }

    .hook-text {
      position: absolute;
      left: 50%;
      top: 1290px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hook-panel {
      background: rgba(247, 244, 238, 0.92);
      border: 1px solid rgba(184, 115, 51, 0.55);
      padding: 22px 42px 26px;
      display: flex;
      align-items: baseline;
      gap: 0.32em;
      white-space: nowrap;
    }

    .hook-word {
      font-family: "Cormorant Garamond", serif;
      font-weight: 400;
      font-size: 46px;
      line-height: 1.2;
      color: #15110c;
      opacity: 0;
    }

    .hook-word-wrap {
      position: relative;
      display: inline-block;
    }

    .hook-underline {
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 100%;
      height: 2px;
      background: #b87333;
      transform-origin: left center;
    }
  </style>

  <div id="root" data-composition-id="01-hook" data-duration="3" data-width="1080" data-height="1920">
    <div class="hook-bg clip" data-start="0" data-duration="3" data-track-index="0"></div>

    <div class="hook-camera" id="hook-camera">
      <img
        class="hook-image clip"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        src="assets/artisan-jeantim.webp"
        alt=""
      />
      <div class="hook-vignette"></div>

      <div class="hook-text clip" data-start="0.6" data-duration="2.4" data-track-index="2">
        <div class="hook-panel">
          <span class="hook-word" id="hook-w0">Je</span>
          <span class="hook-word" id="hook-w1">m'appelle</span>
          <span class="hook-word-wrap">
            <span class="hook-word" id="hook-w2">Jeantim.</span>
            <span class="hook-underline" id="hook-underline"></span>
          </span>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---------------------------------------------------------------
      // multi-phase-camera — camera wraps the whole scene; ONE writer
      // composes phase-scale (steady push) + a barely-perceptible sine
      // drift into camera.style.transform.
      // ---------------------------------------------------------------
      var camera = document.getElementById("hook-camera");
      var phase = { scale: 1.0 }; // Phase 1 — neutral, no tween

      // Steady push: neutral -> slight push -> more push, spanning the shot.
      tl.to(phase, { scale: 1.035, duration: 1.2, ease: "power1.out" }, 0);
      tl.to(phase, { scale: 1.075, duration: 1.3, ease: "power1.inOut" }, 1.2);

      var DRIFT_AMP_X = 3;
      var DRIFT_AMP_Y = 2;
      var DRIFT_FREQ_RATIO = 1.3;
      var DRIFT_CYCLES = 1;
      var TOTAL_DURATION = 2.5;

      var drift = { p: 0 };
      tl.to(
        drift,
        {
          p: Math.PI * 2 * DRIFT_CYCLES,
          duration: TOTAL_DURATION,
          ease: "none",
          onUpdate: function () {
            var dx = Math.sin(drift.p) * DRIFT_AMP_X;
            var dy = Math.sin(drift.p * DRIFT_FREQ_RATIO) * DRIFT_AMP_Y;
            camera.style.transform =
              "scale(" + phase.scale + ") translate(" + dx + "px, " + dy + "px)";
          },
        },
        0,
      );

      // ---------------------------------------------------------------
      // dynamic-content-sequencing (adapted for a stacking reveal) —
      // each word's entrance is computed once from its length, then
      // fired as its own fromTo at the pre-computed absolute time.
      // Words STACK (stay visible), never swap out.
      // ---------------------------------------------------------------
      var SEQ_START = 0.6;
      var BASE_DURATION = 0.12;
      var SEC_PER_CHAR = 0.045;

      var WORDS = [
        { id: "hook-w0", text: "Je" },
        { id: "hook-w1", text: "m'appelle" },
        { id: "hook-w2", text: "Jeantim." },
      ];

      var cumulative = SEQ_START;
      var WORD_TIMELINE = WORDS.map(function (entry) {
        var dur = BASE_DURATION + entry.text.length * SEC_PER_CHAR;
        var start = cumulative;
        cumulative += dur;
        return { id: entry.id, start: start, end: cumulative };
      });

      WORD_TIMELINE.forEach(function (entry) {
        tl.fromTo(
          "#" + entry.id,
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          entry.start,
        );
      });

      // Cuivre accent underline draws in beneath the last word once it lands.
      var lastEnd = WORD_TIMELINE[WORD_TIMELINE.length - 1].end;
      tl.fromTo(
        "#hook-underline",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        lastEnd + 0.05,
      );
      // Holds to the cut — no exit tween (non-final-frame rule: transition IS the exit).

      window.__timelines["01-hook"] = tl;
    })();
  </script>
</template>
