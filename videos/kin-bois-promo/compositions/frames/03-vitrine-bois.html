  <script>
    (function () {

      var camera = document.getElementById("vb03-camera");
      var TOTAL_DURATION = 2.2;

      // Multi-phase camera: brisk pull-back -> settle -> continued push,

      // Continuous sine drift, one writer of camera.style.transform.

        drift,
        {

          duration: TOTAL_DURATION,
          ease: "none",
