<script>

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    var camera = document.getElementById("artisan-camera");

    // Multi-phase camera — brisker than the hero frame: quick pull-back-in
    // then a steady push that keeps running under the label hold.
    var phase = { scale: 0.92 }; // Phase 1 — initial value, no tween
    tl.to(phase, { scale: 1.0, duration: 0.5, ease: "power2.out" }, 0.05); // Phase 2 — quick settle

    var drift = { p: 0 };
    tl.to(
      drift,
      {
        p: Math.PI * 2 * 1.5,
        duration: 3,
        ease: "none",
        onUpdate: function () {
          var dx = Math.sin(drift.p) * 5;
          var dy = Math.sin(drift.p * 1.3) * 3;
          camera.style.transform = "scale(" + phase.scale + ") translate(" + dx + "px, " + dy + "px)";
        },
      },
      0,
    );

    // Scene 1 (0.0–0.4s) — screenshot cuts in.
    tl.fromTo("#artisan-img", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0);
