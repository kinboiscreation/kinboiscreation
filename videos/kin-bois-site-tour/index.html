<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F7F4EE;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-logo"
        class="scene"
        data-composition-id="01-logo"
        data-composition-src="compositions/frames/01-logo.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-hero"
        class="scene"
        data-composition-id="02-hero"
        data-composition-src="compositions/frames/02-hero.html"
        data-start="3.5"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-artisan"
        class="scene"
        data-composition-id="03-artisan"
        data-composition-src="compositions/frames/03-artisan.html"
        data-start="8"
        data-duration="3.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-catalogue-un"
        class="scene"
        data-composition-id="04-catalogue-un"
        data-composition-src="compositions/frames/04-catalogue-un.html"
        data-start="11"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-05-catalogue-deux"
        class="scene"
        data-composition-id="05-catalogue-deux"
        data-composition-src="compositions/frames/05-catalogue-deux.html"
        data-start="14.5"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div
        id="el-06-pourquoi"
        class="scene"
        data-composition-id="06-pourquoi"
        data-composition-src="compositions/frames/06-pourquoi.html"
        data-start="18"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-avis"
        class="scene"
        data-composition-id="07-avis"
        data-composition-src="compositions/frames/07-avis.html"
        data-start="22"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-08-cta"
        class="scene"
        data-composition-id="08-cta"
        data-composition-src="compositions/frames/08-cta.html"
        data-start="26"
        data-duration="5"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-logo", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.5);
        tl.fromTo("#el-02-hero", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.5);
        tl.to("#el-02-hero", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 8);
        tl.fromTo("#el-03-artisan", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 8);
        tl.to("#el-03-artisan", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 11);
        tl.fromTo("#el-04-catalogue-un", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 11);
        tl.to("#el-04-catalogue-un", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 14.5);
        tl.fromTo("#el-05-catalogue-deux", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 14.5);
        tl.to("#el-05-catalogue-deux", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.fromTo("#el-06-pourquoi", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.to("#el-06-pourquoi", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.fromTo("#el-07-avis", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.to("#el-07-avis", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 26);
        tl.fromTo("#el-08-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 26);
        tl.to({}, { duration: 31 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
